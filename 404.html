<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena – Cenosled</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --paper: #f4f6fa; --sheet: #ffffff; --ink: #0b1f3a; --muted: #4a5a72; --line: #d3dae6; --petrol: #1f52d6;
          --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--font); }
  a { color: var(--petrol); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header { padding: 22px 0; }
  header a { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  main { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 28px 32px; margin-bottom: 40px; }
  h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 32px 0 8px; }
  p, li { color: var(--muted); }
  ul { padding-left: 22px; }
  .small { font-size: 14px; }
  @media (max-width: 600px) { main { padding: 22px 18px; } }
</style>
</head>
<body>
<header><div class="wrap"><a href="/">← Cenosled</a></div></header>

<div class="wrap">
<main>
  <h1>Tuhle stránku jsme nenašli</h1>
  <p>Odkaz je možná zastaralý nebo v něm je překlep.</p>
  <p><a href="/">Přejít na hlavní stránku Cenosled</a> a nechat si zdarma porovnat ceny s konkurencí.</p>
</main>
</div>
</body>
</html>
